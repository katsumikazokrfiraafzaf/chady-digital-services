<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chady Digital Services</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f1a; --surface: #131929; --surface2: #1a2235;
    --accent: #00d4ff; --accent2: #7c3aed; --gold: #f59e0b;
    --text: #e8edf5; --muted: #8899b0; --white: #ffffff; --green: #22c55e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg); color: var(--text);
    overflow-x: hidden; transition: opacity .22s ease;
  }
  body.lang-ar { font-family: 'Cairo', sans-serif; }
  body.fading   { opacity: 0; }

  /* ── LANG SWITCHER ── */
  .lang-switcher {
    display: flex; align-items: center; gap: 4px;
    background: rgba(0,212,255,0.07);
    border: 1px solid rgba(0,212,255,0.18);
    border-radius: 50px; padding: 4px 5px;
  }
  .lang-btn {
    padding: 5px 14px; border-radius: 50px; border: none;
    background: transparent; color: var(--muted);
    font-size: .8rem; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; transition: background .2s, color .2s;
    font-family: inherit;
  }
  .lang-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .lang-btn:not(.active):hover { color: var(--accent); }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 5%; background: rgba(11,15,26,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0,212,255,0.08); transition: all .3s;
  }
  .nav-right { display: flex; align-items: center; gap: 14px; }
  .logo {
    font-family: 'Syne', sans-serif; font-size: 1.25rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -.5px;
  }
  .logo span { -webkit-text-fill-color: var(--accent); }
  nav ul { display: flex; gap: 2rem; list-style: none; }
  nav a { font-size: .9rem; font-weight: 500; color: var(--muted); text-decoration: none; letter-spacing: .03em; transition: color .25s; }
  nav a:hover { color: var(--accent); }
  .nav-cta { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--white) !important; padding: 8px 20px; border-radius: 50px; font-weight: 600 !important; transition: opacity .25s !important; }
  .nav-cta:hover { opacity: .85; }

  /* Hamburger */
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
  .hamburger span { width: 25px; height: 2px; background: var(--text); border-radius: 2px; transition: all .3s; }
  .mobile-menu {
    display: none; position: fixed; top: 65px; left: 0; right: 0;
    background: rgba(11,15,26,0.98); backdrop-filter: blur(20px);
    padding: 1.5rem 5%; border-bottom: 1px solid rgba(0,212,255,0.1); z-index: 99;
  }
  .mobile-menu.open { display: block; }
  .mobile-menu a {
    display: block; padding: 12px 0; font-size: 1.05rem;
    color: var(--muted); text-decoration: none; font-weight: 500;
    border-bottom: 1px solid rgba(255,255,255,0.05); transition: color .2s;
  }
  .mobile-menu a:hover { color: var(--accent); }
  .mobile-lang { display: flex; gap: 10px; padding: 14px 0; }

  /* ── HERO ── */
  #home {
    min-height: 100vh; display: flex; align-items: center;
    padding: 120px 5% 80px; position: relative; overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 80% 60% at 60% 40%, rgba(124,58,237,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 50% at 20% 80%, rgba(0,212,255,0.08) 0%, transparent 60%);
  }
  .grid-overlay {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .hero-content { position: relative; z-index: 1; max-width: 650px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,212,255,0.08); border: 1px solid rgba(0,212,255,0.2);
    color: var(--accent); padding: 6px 16px; border-radius: 50px;
    font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 24px;
  }
  .badge::before { content: '●'; font-size: .5rem; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2.2rem, 5.5vw, 3.8rem);
    font-weight: 800; line-height: 1.15; margin-bottom: 20px; letter-spacing: -1.5px;
  }
  body.lang-ar h1 { font-family: 'Cairo', sans-serif; letter-spacing: 0; }
  h1 .highlight {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tagline { font-size: 1rem; color: var(--accent); font-weight: 600; letter-spacing: .2em; text-transform: uppercase; margin-bottom: 16px; }
  .tagline span { margin: 0 8px; opacity: .4; }
  .hero-desc { font-size: 1.05rem; color: var(--muted); line-height: 1.75; margin-bottom: 36px; max-width: 520px; }
  .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, #00d4ff, #7c3aed); color: #fff;
    padding: 14px 30px; border-radius: 50px; font-weight: 600; font-size: .95rem; text-decoration: none;
    box-shadow: 0 8px 32px rgba(0,212,255,0.25); transition: transform .2s, box-shadow .2s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,212,255,0.35); }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(0,212,255,0.3); color: var(--accent);
    padding: 14px 30px; border-radius: 50px; font-weight: 600; font-size: .95rem; text-decoration: none;
    transition: background .2s, transform .2s;
  }
  .btn-outline:hover { background: rgba(0,212,255,0.06); transform: translateY(-2px); }
  .hero-stats { display: flex; gap: 40px; margin-top: 56px; padding-top: 40px; border-top: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap; }
  .stat-num { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; color: var(--white); }
  .stat-num span { color: var(--accent); }
  .stat-label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

  /* ── SECTIONS ── */
  section { padding: 100px 5%; }
  .section-label { font-size: .75rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; display: block; }
  .section-title { font-family: 'Syne', sans-serif; font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 800; letter-spacing: -1px; margin-bottom: 16px; }
  body.lang-ar .section-title { font-family: 'Cairo', sans-serif; letter-spacing: 0; }
  .section-sub { color: var(--muted); font-size: 1rem; line-height: 1.7; max-width: 520px; }
  .section-header { margin-bottom: 60px; }

  /* ── SERVICES ── */
  #services { background: var(--surface); }
  .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 24px; }
  .service-card {
    background: var(--bg); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px; padding: 32px; position: relative; overflow: hidden;
    transition: transform .3s, border-color .3s, box-shadow .3s; cursor: default;
  }
  .service-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity .3s; }
  .service-card:hover { transform: translateY(-6px); border-color: rgba(0,212,255,0.2); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .service-card:hover::before { opacity: 1; }
  .card-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 20px; }
  .icon-cyan   { background: rgba(0,212,255,0.1); }
  .icon-purple { background: rgba(124,58,237,0.12); }
  .icon-green  { background: rgba(34,197,94,0.1); }
  .icon-gold   { background: rgba(245,158,11,0.1); }
  .icon-pink   { background: rgba(236,72,153,0.1); }
  .icon-orange { background: rgba(249,115,22,0.1); }
  .card-title  { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
  body.lang-ar .card-title { font-family: 'Cairo', sans-serif; }
  .card-desc   { color: var(--muted); font-size: .9rem; line-height: 1.65; margin-bottom: 20px; }
  .card-tags   { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tag { font-size: .72rem; font-weight: 600; letter-spacing: .05em; padding: 4px 10px; border-radius: 50px; background: rgba(0,212,255,0.08); color: var(--accent); border: 1px solid rgba(0,212,255,0.15); }
  .tag-purple { background: rgba(124,58,237,0.1); color: #a78bfa; border-color: rgba(124,58,237,0.2); }
  .tag-pink   { background: rgba(236,72,153,0.1); color: #f472b6; border-color: rgba(236,72,153,0.2); }
  .tag-orange { background: rgba(249,115,22,0.1); color: #fb923c; border-color: rgba(249,115,22,0.2); }
  .card-price { display: flex; align-items: baseline; gap: 4px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.06); }
  .price-num  { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--white); }
  .price-unit { font-size: .8rem; color: var(--muted); }
  .card-list  { list-style: none; margin-bottom: 20px; }
  .card-list li { color: var(--muted); font-size: .9rem; padding: 5px 0 5px 18px; position: relative; line-height: 1.5; }
  .card-list li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-size: .75rem; top: 6px; }
  html[dir="rtl"] .card-list li { padding: 5px 18px 5px 0; }
  html[dir="rtl"] .card-list li::before { left: auto; right: 0; content: '←'; }

  /* ── PORTFOLIO ── */
  .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .portfolio-item {
    border-radius: 16px; overflow: hidden; position: relative; aspect-ratio: 16/10;
    background: var(--surface2); border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s, box-shadow .3s; cursor: pointer;
  }
  .portfolio-item:hover { transform: scale(1.02); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .portfolio-placeholder { display: flex; flex-direction: column; align-items: center; gap: 12px; color: var(--muted); text-align: center; padding: 20px; }
  .portfolio-placeholder .p-icon { font-size: 2.5rem; }
  .portfolio-placeholder .p-label { font-size: .85rem; font-weight: 500; }
  .portfolio-item .overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%); opacity: 0; transition: opacity .3s; display: flex; align-items: flex-end; padding: 20px; }
  .portfolio-item:hover .overlay { opacity: 1; }
  .overlay-text { color: #fff; font-size: .85rem; font-weight: 500; }
  .portfolio-upload-hint { margin-top: 40px; text-align: center; padding: 28px; border-radius: 16px; border: 2px dashed rgba(0,212,255,0.15); color: var(--muted); font-size: .9rem; }
  .portfolio-upload-hint strong { color: var(--accent); }

  /* ── REVIEWS ── */
  #reviews { background: var(--surface); }
  .reviews-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
  .review-card { background: var(--bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 28px; transition: transform .3s, border-color .3s; }
  .review-card:hover { transform: translateY(-4px); border-color: rgba(245,158,11,0.2); }
  .stars { color: var(--gold); font-size: 1rem; letter-spacing: 2px; margin-bottom: 16px; }
  .review-text { color: var(--muted); font-size: .95rem; line-height: 1.7; margin-bottom: 20px; font-style: italic; }
  .reviewer { display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
  .reviewer-avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 700; font-size: .85rem; color: #fff; flex-shrink: 0; }
  .reviewer-name { font-weight: 600; font-size: .9rem; color: var(--text); }
  .reviewer-sub  { font-size: .75rem; color: var(--muted); }

  /* ── CONTACT ── */
  #contact { text-align: center; background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(124,58,237,0.1) 0%, transparent 70%); }
  .contact-inner { max-width: 560px; margin: 0 auto; }
  .contact-inner .section-sub { margin: 0 auto 48px; }
  .whatsapp-btn {
    display: inline-flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; text-decoration: none;
    padding: 18px 40px; border-radius: 60px; font-size: 1.1rem; font-weight: 700;
    box-shadow: 0 10px 40px rgba(37,211,102,0.3); transition: transform .25s, box-shadow .25s; letter-spacing: .01em;
  }
  .whatsapp-btn:hover { transform: translateY(-3px); box-shadow: 0 16px 50px rgba(37,211,102,0.4); }
  .whatsapp-btn svg { width: 28px; height: 28px; flex-shrink: 0; }
  .contact-info { margin-top: 32px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .contact-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid rgba(255,255,255,0.07); padding: 10px 20px; border-radius: 50px; font-size: .85rem; color: var(--muted); }

  /* ── RATE US SECTION ── */
  #rate-us { background: var(--bg); }
  .rateus-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
  @media(max-width:860px){ .rateus-layout { grid-template-columns: 1fr; } }

  /* Form */
  .rateus-form-wrap {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 24px; padding: 36px;
  }
  .form-group { margin-bottom: 22px; }
  .form-label {
    display: block; font-size: .8rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .form-input {
    width: 100%; background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 12px 16px;
    color: var(--text); font-family: inherit; font-size: .95rem;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }
  textarea.form-input { resize: vertical; min-height: 110px; }

  /* Interactive star picker */
  .star-picker { display: flex; gap: 8px; flex-direction: row-reverse; justify-content: flex-end; }
  html[dir="rtl"] .star-picker { flex-direction: row; justify-content: flex-end; }
  .star-picker input { display: none; }
  .star-picker label {
    font-size: 2rem; cursor: pointer; color: rgba(255,255,255,0.15);
    transition: color .15s, transform .15s;
    user-select: none;
  }
  .star-picker label:hover,
  .star-picker label:hover ~ label,
  .star-picker input:checked ~ label { color: var(--gold); }
  .star-picker label:hover { transform: scale(1.2); }

  /* Submit button */
  .btn-submit {
    width: 100%; padding: 14px; border: none; border-radius: 50px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; font-family: inherit; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: transform .2s, box-shadow .2s;
    box-shadow: 0 6px 24px rgba(0,212,255,0.2);
    letter-spacing: .02em;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0,212,255,0.3); }
  .btn-submit:active { transform: scale(.98); }

  /* Success toast */
  .submit-toast {
    display: none; align-items: center; gap: 10px;
    background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25);
    color: #4ade80; border-radius: 12px; padding: 14px 18px;
    font-size: .9rem; font-weight: 600; margin-top: 16px;
  }
  .submit-toast.show { display: flex; animation: slideIn .4s ease; }
  @keyframes slideIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

  /* Summary bar */
  .rateus-summary {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px; padding: 28px; margin-bottom: 24px;
    display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  }
  .summary-score {
    font-family: 'Syne', sans-serif; font-size: 3.5rem; font-weight: 800;
    color: var(--white); line-height: 1;
  }
  .summary-stars { color: var(--gold); font-size: 1.1rem; letter-spacing: 2px; }
  .summary-count { font-size: .8rem; color: var(--muted); margin-top: 4px; }
  .summary-bars { flex: 1; min-width: 140px; display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; font-size: .75rem; color: var(--muted); }
  .bar-track { flex: 1; height: 6px; background: rgba(255,255,255,0.07); border-radius: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; transition: width .5s ease; }

  /* Submitted reviews grid */
  .user-reviews-grid {
    display: grid; grid-template-columns: 1fr;
    gap: 14px; max-height: 420px; overflow-y: auto;
    padding-right: 4px;
  }
  .user-reviews-grid::-webkit-scrollbar { width: 4px; }
  .user-reviews-grid::-webkit-scrollbar-track { background: transparent; }
  .user-reviews-grid::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.2); border-radius: 4px; }
  .user-review-card {
    background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px; padding: 18px 20px;
    animation: slideIn .4s ease;
  }
  .user-review-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 6px; }
  .user-review-name { font-weight: 700; font-size: .9rem; color: var(--text); }
  .user-review-stars { color: var(--gold); font-size: .85rem; letter-spacing: 1px; }
  .user-review-text { color: var(--muted); font-size: .88rem; line-height: 1.6; }
  .user-review-date { font-size: .72rem; color: rgba(136,153,176,0.6); margin-top: 8px; }
  .no-reviews-msg { text-align: center; color: var(--muted); font-size: .9rem; padding: 40px 20px; opacity: .6; }

  /* ── FOOTER ── */
  footer { background: var(--surface); border-top: 1px solid rgba(255,255,255,0.05); padding: 40px 5%; text-align: center; }
  .footer-logo { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
  footer p { color: var(--muted); font-size: .85rem; }

  /* ── FADE-UP ── */
  .fade-up { opacity: 0; transform: translateY(30px); transition: opacity .6s ease, transform .6s ease; }
  .fade-up.visible { opacity: 1; transform: translateY(0); }

  /* ── RTL ── */
  html[dir="rtl"] .hero-content { text-align: right; }
  html[dir="rtl"] .section-header { text-align: right; }
  html[dir="rtl"] nav ul { flex-direction: row-reverse; }
  html[dir="rtl"] .hero-btns { flex-direction: row-reverse; }
  html[dir="rtl"] .hero-stats { flex-direction: row-reverse; }
  html[dir="rtl"] .reviewer { flex-direction: row-reverse; }
  html[dir="rtl"] .reviewer > div:last-child { text-align: right; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    nav ul { display: none; }
    .hamburger { display: flex; }
    .hero-btns { flex-direction: column; align-items: flex-start; }
    html[dir="rtl"] .hero-btns { align-items: flex-end; }
    .hero-stats { gap: 24px; }
    section { padding: 70px 5%; }
  }
</style>
</head>
<body class="lang-fr">

<!-- NAV -->
<nav id="navbar">
  <div class="logo">Chady<span>.</span>Digital</div>
  <ul>
    <li><a href="#home"      data-i18n="nav_home"></a></li>
    <li><a href="#services"  data-i18n="nav_services"></a></li>
    <li><a href="#portfolio" data-i18n="nav_portfolio"></a></li>
    <li><a href="#reviews"   data-i18n="nav_reviews"></a></li>
    <li><a href="#rate-us"   data-i18n="nav_rateus"></a></li>
    <li><a href="#contact"   class="nav-cta" data-i18n="nav_contact"></a></li>
  </ul>

/* ════════════════════════════════
   LANGUAGE ENGINE
════════════════════════════════ */
let currentLang = 'fr';

function applyTranslations() {
  const dict = T[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.textContent = dict[key];
  });
}

function setLang(lang) {
  if (lang === currentLang) return;
  document.body.classList.add('fading');

  setTimeout(() => {
    currentLang = lang;

    // RTL / LTR + font class
    if (lang === 'ar') {
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.setAttribute('lang', 'ar');
      document.body.classList.replace('lang-fr', 'lang-ar');
    } else {
      document.documentElement.setAttribute('dir', 'ltr');
      document.documentElement.setAttribute('lang', 'fr');
      document.body.classList.replace('lang-ar', 'lang-fr');
    }

    applyTranslations();

    // WhatsApp link
    document.getElementById('whatsappBtn').href =
      `https://wa.me/212636483530?text=${encodeURIComponent(T[lang].wa_msg)}`;

    // Active button
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');

    document.body.classList.remove('fading');
  }, 220);
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  applyTranslations();

  // Scroll fade-up
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (e.isIntersecting) setTimeout(() => e.target.classList.add('visible'), i * 80);
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));

  // Nav scroll tint
  window.addEventListener('scroll', () => {
    document.getElementById('navbar').style.background =
      window.scrollY > 60 ? 'rgba(11,15,26,0.97)' : 'rgba(11,15,26,0.85)';
  });
});

function toggleMenu() { document.getElementById('mobileMenu').classList.toggle('open'); }
function closeMenu()  { document.getElementById('mobileMenu').classList.remove('open'); }

/* ════════════════════════════════
   REVIEW SUBMISSION
════════════════════════════════ */
let userReviews = [];

function submitReview() {
  const name    = document.getElementById('ru-name').value.trim();
  const comment = document.getElementById('ru-comment').value.trim();
  const ratingEl = document.querySelector('input[name="rating"]:checked');
  const dict = T[currentLang];

  if (!name || !ratingEl) {
    const field = !name ? 'ru-name' : 'starPicker';
    const el = document.getElementById(field);
    el.style.outline = '2px solid #f87171';
    setTimeout(() => el.style.outline = '', 1500);
    return;
  }

  const rating = parseInt(ratingEl.value);
  const now = new Date();
  const dateStr = now.toLocaleDateString(currentLang === 'ar' ? 'ar-MA' : 'fr-FR', { day:'numeric', month:'long', year:'numeric' });

  userReviews.unshift({ name, rating, comment, date: dateStr });

  // Reset form
  document.getElementById('ru-name').value = '';
  document.getElementById('ru-comment').value = '';
  document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = false);

  // Show toast
  const toast = document.getElementById('submitToast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3500);

  renderUserReviews();
  updateSummary();
}

function renderUserReviews() {
  const grid = document.getElementById('userReviewsGrid');
  const dict = T[currentLang];

  if (userReviews.length === 0) {
    grid.innerHTML = `<div class="no-reviews-msg" id="noReviewsMsg" data-i18n="ru_empty">${dict.ru_empty}</div>`;
    return;
  }

  grid.innerHTML = userReviews.map(r => {
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    const initials = r.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    return `
      <div class="user-review-card">
        <div class="user-review-header">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="reviewer-avatar" style="width:32px;height:32px;font-size:.75rem">${initials}</div>
            <span class="user-review-name">${escHtml(r.name)}</span>
          </div>
          <span class="user-review-stars">${stars}</span>
        </div>
        ${r.comment ? `<div class="user-review-text">${escHtml(r.comment)}</div>` : ''}
        <div class="user-review-date">${r.date}</div>
      </div>`;
  }).join('');
}

function updateSummary() {
  if (userReviews.length === 0) return;
  const total = userReviews.length;
  const avg   = userReviews.reduce((s, r) => s + r.rating, 0) / total;
  const counts = [0,0,0,0,0];
  userReviews.forEach(r => counts[r.rating - 1]++);

  document.getElementById('summaryScore').textContent = avg.toFixed(1);
  const filled = Math.round(avg);
  document.getElementById('summaryStars').textContent = '★'.repeat(filled) + '☆'.repeat(5-filled);

  const dict = T[currentLang];
  document.getElementById('summaryCount').textContent =
    currentLang === 'ar' ? `${total} تقييم` : `${total} avis`;

  for (let i = 1; i <= 5; i++) {
    const pct = total > 0 ? Math.round((counts[i-1] / total) * 100) : 0;
    document.getElementById(`bar${i}`).style.width = pct + '%';
    document.getElementById(`cnt${i}`).textContent = counts[i-1];
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Extend applyTranslations to handle placeholders and re-render dynamic content
const _origApply = applyTranslations;
applyTranslations = function() {
  _origApply();
  const dict = T[currentLang];
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (dict[key]) el.placeholder = dict[key];
  });
  // Re-render user reviews with updated locale date labels isn't needed,
  // but refresh the empty/summary text
  if (userReviews.length === 0) {
    const msg = document.getElementById('noReviewsMsg');
    if (msg) msg.textContent = dict.ru_empty || '';
  } else {
    updateSummary();
  }
};
