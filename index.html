<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chady Digital Studio creates premium video, photo, and ad content for creators, local brands, and growing businesses.">
  <title>Chady Digital Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #071018;
      --bg-soft: #0b1621;
      --surface: rgba(14, 25, 36, 0.88);
      --surface-strong: #101d2b;
      --surface-alt: #142434;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #edf4f8;
      --muted: #92a5b6;
      --accent: #ff8a3d;
      --accent-soft: #ffd166;
      --accent-cyan: #2ad0c3;
      --success: #69d48f;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --container: 1180px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Sora", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 138, 61, 0.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(42, 208, 195, 0.12), transparent 26%),
        linear-gradient(180deg, #071018 0%, #0a131d 40%, #071018 100%);
      min-height: 100vh;
      overflow-x: hidden;
      transition: opacity 0.25s ease;
    }

    body.lang-ar {
      font-family: "IBM Plex Sans Arabic", sans-serif;
    }

    body.is-switching {
      opacity: 0.45;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 88px 88px;
      mask-image: radial-gradient(circle at center, black 20%, transparent 85%);
      opacity: 0.32;
      z-index: 0;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-shell {
      position: relative;
      z-index: 1;
    }

    .container {
      width: min(calc(100% - 32px), var(--container));
      margin-inline: auto;
    }

    .section {
      padding: 110px 0;
      position: relative;
    }

    .section-header {
      display: grid;
      gap: 16px;
      max-width: 760px;
      margin-bottom: 42px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-soft);
    }

    .eyebrow::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      box-shadow: 0 0 18px rgba(255, 138, 61, 0.5);
    }

    .section-title {
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      font-weight: 800;
    }

    body.lang-ar .section-title {
      letter-spacing: 0;
      line-height: 1.2;
    }

    .section-copy {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--muted);
      max-width: 640px;
    }

    .surface-card {
      background: linear-gradient(180deg, rgba(18, 31, 44, 0.94), rgba(11, 22, 32, 0.96));
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: 18px;
    }

    .nav-shell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 14px 18px;
      border-radius: 999px;
      background: rgba(8, 17, 25, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
    }

    .site-nav.scrolled .nav-shell {
      background: rgba(8, 17, 25, 0.92);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 138, 61, 0.18), rgba(42, 208, 195, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--accent-soft);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-text {
      display: grid;
      gap: 2px;
    }

    .brand-title {
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.88rem;
      color: var(--muted);
      transition: color 0.2s ease;
      white-space: nowrap;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .lang-btn.active {
      background: linear-gradient(135deg, var(--accent), #ffb257);
      color: #081017;
    }

    .lang-btn:not(.active):hover {
      color: var(--text);
    }

    .cta-button,
    .ghost-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .cta-button {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: #071018;
      box-shadow: 0 18px 40px rgba(255, 138, 61, 0.25);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 48px rgba(255, 138, 61, 0.32);
    }

    .ghost-button {
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .ghost-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-cta {
      padding-inline: 18px;
    }

    .mobile-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      color: var(--text);
    }

    .mobile-toggle svg {
      width: 22px;
      height: 22px;
      margin: auto;
    }

    .mobile-menu {
      display: none;
      margin-top: 12px;
      padding: 18px;
      border-radius: 26px;
      background: rgba(8, 17, 25, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }

    .mobile-menu.open {
      display: grid;
      gap: 12px;
    }

    .mobile-menu a {
      color: var(--muted);
      padding: 12px 10px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
    }

    .mobile-menu .lang-switcher {
      justify-content: center;
      margin-top: 4px;
    }

    .hero {
      padding-top: 34px;
      padding-bottom: 88px;
    }

    .hero-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
      gap: 42px;
      align-items: center;
    }

    .hero-copy {
      display: grid;
      gap: 24px;
    }

    .hero-intro {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.82rem;
      color: var(--accent-soft);
      font-weight: 600;
    }

    .hero-intro::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
      box-shadow: 0 0 18px rgba(105, 212, 143, 0.55);
    }

    .hero-title {
      font-size: clamp(2.8rem, 6vw, 5.9rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 800;
      max-width: 11ch;
    }

    body.lang-ar .hero-title {
      letter-spacing: 0;
      line-height: 1.15;
      max-width: 13ch;
    }

    .hero-title .accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      color: var(--muted);
      line-height: 1.85;
      font-size: 1.04rem;
      max-width: 62ch;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-notes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-note {
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 0.84rem;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .stat-card {
      padding: 22px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      display: grid;
      gap: 10px;
    }

    .stat-value {
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .hero-visual {
      position: relative;
      min-height: 660px;
      display: grid;
      place-items: center;
    }

    .hero-panel {
      position: relative;
      width: 100%;
      max-width: 520px;
      min-height: 620px;
      padding: 18px;
      border-radius: 38px;
      background:
        linear-gradient(160deg, rgba(255, 138, 61, 0.14), rgba(42, 208, 195, 0.05) 42%, rgba(255, 255, 255, 0.03) 100%),
        rgba(11, 22, 31, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }

    .visual-card {
      position: absolute;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.32);
      background: #0d1722;
    }

    .visual-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .visual-card.main {
      inset: 26px 24px 190px 24px;
    }

    .visual-card.secondary-a {
      width: 210px;
      height: 240px;
      left: 20px;
      bottom: 24px;
      transform: rotate(-5deg);
    }

    .visual-card.secondary-b {
      width: 180px;
      height: 220px;
      right: 24px;
      bottom: 32px;
      transform: rotate(6deg);
    }

    .floating-card {
      position: absolute;
      z-index: 3;
      padding: 16px 18px;
      border-radius: 20px;
      background: rgba(7, 16, 24, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .floating-card.top {
      top: 24px;
      right: -18px;
      width: 220px;
    }

    .floating-card.bottom {
      left: -10px;
      bottom: 182px;
      width: 250px;
    }

    .floating-label {
      font-size: 0.76rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin-bottom: 8px;
    }

    .floating-value {
      font-size: 1.2rem;
      line-height: 1.35;
      font-weight: 700;
    }

    .floating-value strong {
      color: var(--accent-soft);
    }

    .audience-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .audience-pill {
      padding: 11px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cfd9e1;
      font-size: 0.84rem;
    }

    .benefit-grid,
    .service-grid,
    .showcase-grid,
    .package-grid,
    .process-grid,
    .review-grid,
    .faq-grid {
      display: grid;
      gap: 18px;
    }

    .benefit-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .benefit-card {
      padding: 28px;
      display: grid;
      gap: 16px;
    }

    .benefit-card .icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(255, 138, 61, 0.18), rgba(42, 208, 195, 0.16));
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .icon svg {
      width: 22px;
      height: 22px;
      color: var(--accent-soft);
    }

    .benefit-title,
    .service-title,
    .package-name,
    .process-title,
    .review-role {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .benefit-text,
    .service-copy,
    .showcase-copy,
    .package-copy,
    .process-copy,
    .review-quote,
    .faq-answer,
    .meta-text {
      color: var(--muted);
      line-height: 1.75;
      font-size: 0.95rem;
    }

    .service-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .service-card {
      padding: 28px;
      display: grid;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft), var(--accent-cyan));
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: var(--line-strong);
    }

    .service-card:hover::before {
      opacity: 1;
    }

    .service-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 18px;
    }

    .service-icon {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }

    .service-icon svg {
      width: 24px;
      height: 24px;
      color: var(--accent-soft);
    }

    .service-price {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--accent-soft);
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 209, 102, 0.24);
      background: rgba(255, 209, 102, 0.08);
      white-space: nowrap;
    }

    .service-tags,
    .addon-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      list-style: none;
    }

    .service-tags li,
    .addon-list li {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: #d4dee6;
      font-size: 0.8rem;
    }

    .showcase-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .showcase-card {
      display: grid;
      gap: 0;
      overflow: hidden;
    }

    .showcase-image {
      position: relative;
      min-height: 320px;
      overflow: hidden;
    }

    .showcase-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 20%, rgba(7, 16, 24, 0.78) 100%);
    }

    .showcase-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .showcase-card:hover .showcase-image img {
      transform: scale(1.04);
    }

    .showcase-body {
      padding: 26px;
      display: grid;
      gap: 12px;
    }

    .showcase-tag {
      display: inline-flex;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(42, 208, 195, 0.1);
      color: #8ce7df;
      border: 1px solid rgba(42, 208, 195, 0.14);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .showcase-title {
      font-size: 1.22rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .showcase-note {
      padding-top: 4px;
      font-size: 0.84rem;
      color: #cdd7de;
    }

    .package-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: stretch;
    }

    .package-card {
      padding: 28px;
      display: grid;
      gap: 18px;
      position: relative;
      overflow: hidden;
    }

    .package-card.featured {
      border-color: rgba(255, 138, 61, 0.28);
      background:
        linear-gradient(180deg, rgba(255, 138, 61, 0.12), rgba(17, 29, 41, 0.96) 25%, rgba(10, 19, 29, 0.98) 100%);
      transform: translateY(-8px);
    }

    .badge-popular {
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 209, 102, 0.12);
      color: var(--accent-soft);
      border: 1px solid rgba(255, 209, 102, 0.24);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .package-price {
      display: grid;
      gap: 8px;
    }

    .package-price span {
      font-size: clamp(2.1rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .package-price small {
      font-size: 0.76rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .package-list {
      display: grid;
      gap: 10px;
      list-style: none;
    }

    .package-list li {
      color: #d7e0e7;
      line-height: 1.55;
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 12px;
      align-items: start;
      font-size: 0.92rem;
    }

    .package-list li::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      margin-top: 8px;
      box-shadow: 0 0 14px rgba(255, 138, 61, 0.45);
    }

    .extra-services {
      margin-top: 24px;
      padding: 24px;
      display: grid;
      gap: 16px;
    }

    .process-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .process-card {
      padding: 26px;
      display: grid;
      gap: 16px;
      min-height: 100%;
    }

    .step-number {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255, 138, 61, 0.12);
      border: 1px solid rgba(255, 138, 61, 0.2);
      color: var(--accent-soft);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .review-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .review-card {
      padding: 28px;
      display: grid;
      gap: 18px;
    }

    .review-stars {

      padding: 22px 24px;

      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-weight: 700;
      line-height: 1.5;

      display: none;
    }

    .faq-item summary span:last-child {

      flex-shrink: 0;
    }

    .faq-answer {
      padding: 0 24px 24px;
    }

    .contact-panel {
      padding: 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

      content: "";
      position: absolute;
      inset: auto -10% -60% auto;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 138, 61, 0.24), transparent 68%);
      filter: blur(10px);

    .contact-text {
      display: grid;
      gap: 16px;

      position: relative;
      z-index: 1;

    .contact-actions {

      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 1;

      font-size: 0.84rem;
    }

    .site-footer {
      padding: 34px 0 44px;
      color: var(--muted);
      font-size: 0.9rem;

    .footer-shell {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 16px;

            question: "كم يستغرق التسليم؟",
            answer: "معظم الأعمال القصيرة يمكن تسليمها خلال 24 إلى 72 ساعة حسب ضغط العمل وتعقيد المشروع."
          },
          {
            question: "هل تعمل بالعربية والفرنسية؟",
            answer: "نعم. الموقع نفسه يدعم اللغتين، ويمكن تنفيذ محتوى مناسب للجمهور المحلي بكل سهولة."
          },
          {
            question: "هل التعديلات مشمولة؟",
            answer: "نعم، توجد تعديلات معقولة للوصول إلى نتيجة نهائية نظيفة، خصوصًا في الباقات الأساسية."
          },
          {
            question: "هل يمكنني طلب ريل واحد أو خدمة صغيرة فقط؟",
            answer: "نعم. يمكنك البدء بطلب صغير ثم الانتقال إلى باقة أكبر أو شهرية عندما تحتاج حجمًا أكبر."
          }
        ],
        contact: {
          eyebrow: "جاهز لرفع مستوى مشروعك؟",
          title: "أرسل فكرتك الآن وسأرجع لك بعرض واضح ومناسب.",
          description: "الموقع الآن بمستوى أقوى بكثير. والخطوة التالية إذا أردت هي استبدال صور العرض بأعمالك الحقيقية وتعديل الأسعار النهائية كما تريد.",
          primaryCta: "إرسال رسالة",
          secondaryCta: "مشاهدة العروض",
          meta: [
            "واتساب مباشر",
            "رد سريع",
            "من المغرب · متاح عن بعد"
          ]
        },
        footer: {
          tagline: "صورة أقوى، عرض أوضح، وبيع أسهل",
          copy: "جميع الحقوق محفوظة"
        },
        waMessage: "مرحبًا، أريد تحسين هوية مشروعي وطلب خدمة."
      }
    };

    let currentLang = "fr";
    let revealObserver;

    const nodes = {
      benefitGrid: document.getElementById("benefitGrid"),
      serviceGrid: document.getElementById("serviceGrid"),
      showcaseGrid: document.getElementById("showcaseGrid"),
      packageGrid: document.getElementById("packageGrid"),
      addonList: document.getElementById("addonList"),
      processGrid: document.getElementById("processGrid"),
      reviewGrid: document.getElementById("reviewGrid"),
      faqGrid: document.getElementById("faqGrid"),
      heroStats: document.getElementById("heroStats"),
      heroNotes: document.getElementById("heroNotes"),
      audienceStrip: document.getElementById("audienceStrip"),
      contactMeta: document.getElementById("contactMeta"),
      year: document.getElementById("year"),
      nav: document.getElementById("siteNav"),
      mobileMenu: document.getElementById("mobileMenu"),
      mobileToggle: document.getElementById("mobileToggle")
    };

    function pathValue(object, path) {
      return path.split(".").reduce((acc, key) => acc && acc[key], object);
    }

    function renderTextContent() {
      const copy = COPY[currentLang];
      document.title = copy.pageTitle;

      document.querySelectorAll("[data-copy]").forEach((node) => {
        const value = pathValue(copy, node.dataset.copy);
        if (value !== undefined) {
          node.textContent = value;
        }
      });

      document.querySelectorAll("[data-copy-html]").forEach((node) => {
        const value = pathValue(copy, node.dataset.copyHtml);
        if (value !== undefined) {
          node.innerHTML = value;
        }
      });
    }

    function renderBenefits() {
      const items = COPY[currentLang].benefits.items;
      nodes.benefitGrid.innerHTML = items.map((item) => `
        <article class="benefit-card surface-card reveal">
          <div class="icon">${ICONS[item.icon]}</div>
          <h3 class="benefit-title">${item.title}</h3>
          <p class="benefit-text">${item.text}</p>
        </article>
      `).join("");
    }

    function renderServices() {
      const items = COPY[currentLang].services;
      nodes.serviceGrid.innerHTML = items.map((item) => `
        <article class="service-card surface-card reveal">
          <div class="service-top">
            <div class="service-icon">${ICONS[item.icon]}</div>
            <div class="service-price">${item.price}</div>
          </div>
          <div>
            <h3 class="service-title">${item.title}</h3>
            <p class="service-copy">${item.copy}</p>
          </div>
          <ul class="service-tags">
            ${item.tags.map((tag) => `<li>${tag}</li>`).join("")}
          </ul>
        </article>
      `).join("");
    }

    function renderShowcase() {
      const items = COPY[currentLang].showcase;
      nodes.showcaseGrid.innerHTML = items.map((item, index) => `
        <article class="showcase-card surface-card reveal">
          <div class="showcase-image">
            <img src="${SHOWCASE_MEDIA[index].image}" alt="${item.title}">
          </div>
          <div class="showcase-body">
            <span class="showcase-tag">${item.tag}</span>
            <h3 class="showcase-title">${item.title}</h3>
            <p class="showcase-copy">${item.copy}</p>
            <p class="showcase-note">${item.note}</p>
          </div>
        </article>
      `).join("");
    }

    function renderPackages() {
      const items = COPY[currentLang].packages;
      nodes.packageGrid.innerHTML = items.map((item) => `
        <article class="package-card surface-card reveal ${item.featured ? "featured" : ""}">
          ${item.featured ? `<span class="badge-popular">${currentLang === "fr" ? "Le plus demandé" : "الأكثر طلبًا"}</span>` : ""}
          <div>
            <h3 class="package-name">${item.name}</h3>
            <p class="package-copy">${item.copy}</p>
          </div>
          <div class="package-price">
            <small>${currentLang === "fr" ? "à partir de" : "ابتداءً من"}</small>
            <span>${item.price}</span>
          </div>
          <ul class="package-list">
            ${item.points.map((point) => `<li>${point}</li>`).join("")}
          </ul>
          <a class="ghost-button wa-link" href="https://wa.me/212636483530" target="_blank" rel="noreferrer">${currentLang === "fr" ? "Commander ce pack" : "اطلب هذه الباقة"}</a>
        </article>
      `).join("");
    }

    function renderExtras() {
      nodes.addonList.innerHTML = COPY[currentLang].extraItems
        .map((item) => `<li>${item}</li>`)
        .join("");
    }

    function renderProcess() {
      const items = COPY[currentLang].process;
      nodes.processGrid.innerHTML = items.map((item, index) => `
        <article class="process-card surface-card reveal">
          <div class="step-number">${index + 1}</div>
          <h3 class="process-title">${item.title}</h3>
          <p class="process-copy">${item.copy}</p>
        </article>
      `).join("");
    }

    function renderReviews() {
      const items = COPY[currentLang].reviews;
      nodes.reviewGrid.innerHTML = items.map((item) => `
        <article class="review-card surface-card reveal">
          <div class="review-stars" aria-hidden="true">
            <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
          </div>
          <p class="review-quote">“${item.quote}”</p>
          <div class="review-footer">
            <div class="review-avatar">${item.avatar}</div>
            <div>
              <div class="review-name">${item.name}</div>
              <div class="review-role">${item.role}</div>
            </div>
          </div>
        </article>
      `).join("");
    }

    function renderFaq() {
      const items = COPY[currentLang].faq;
      nodes.faqGrid.innerHTML = items.map((item) => `
        <details class="faq-item surface-card reveal">
          <summary>
            <span>${item.question}</span>
            <span>+</span>
          </summary>
          <div class="faq-answer">${item.answer}</div>
        </details>
      `).join("");
    }

    function renderHeroMeta() {
      const hero = COPY[currentLang].hero;

      nodes.heroNotes.innerHTML = hero.notes
        .map((item) => `<span class="hero-note">${item}</span>`)
        .join("");

      nodes.heroStats.innerHTML = hero.stats.map((item) => `
        <article class="stat-card surface-card reveal">
          <div class="stat-value">${item.value}</div>
          <div class="stat-label">${item.label}</div>
        </article>
      `).join("");

      nodes.audienceStrip.innerHTML = hero.audiences
        .map((item) => `<span class="audience-pill">${item}</span>`)
        .join("");
    }

    function renderContactMeta() {
      nodes.contactMeta.innerHTML = COPY[currentLang].contact.meta
        .map((item) => `<span class="meta-chip">${item}</span>`)
        .join("");
    }

    function setWhatsAppLinks() {
      const message = encodeURIComponent(COPY[currentLang].waMessage);
      document.querySelectorAll(".wa-link").forEach((link) => {
        link.href = `https://wa.me/212636483530?text=${message}`;
      });
    }

    function setupRevealObserver() {
      if (revealObserver) {
        revealObserver.disconnect();
      }

      revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.14 });

      document.querySelectorAll(".reveal").forEach((element) => {
        revealObserver.observe(element);
      });
    }

    function updateLangButtons() {
      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === currentLang);
      });
    }

    function setLanguage(lang, persist = true) {
      if (!COPY[lang]) return;

      document.body.classList.add("is-switching");

      window.setTimeout(() => {
        currentLang = lang;
        document.documentElement.lang = lang === "ar" ? "ar" : "fr";
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        document.body.classList.toggle("lang-ar", lang === "ar");
        document.body.classList.toggle("lang-fr", lang !== "ar");

        renderTextContent();
        renderHeroMeta();
        renderBenefits();
        renderServices();
        renderShowcase();
        renderPackages();
        renderExtras();
        renderProcess();
        renderReviews();
        renderFaq();
        renderContactMeta();
        setWhatsAppLinks();
        updateLangButtons();
        setupRevealObserver();

        if (persist) {
          try {
            localStorage.setItem("chady-digital-lang", lang);
          } catch (error) {
            // Ignore localStorage errors.
          }
        }

        nodes.mobileMenu.classList.remove("open");
        nodes.mobileToggle.setAttribute("aria-expanded", "false");
        document.body.classList.remove("is-switching");
      }, 150);
    }

    function handleScroll() {
      nodes.nav.classList.toggle("scrolled", window.scrollY > 20);
    }

    function initMenu() {
      nodes.mobileToggle.addEventListener("click", () => {
        const isOpen = nodes.mobileMenu.classList.toggle("open");
        nodes.mobileToggle.setAttribute("aria-expanded", String(isOpen));
      });

      nodes.mobileMenu.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          nodes.mobileMenu.classList.remove("open");
          nodes.mobileToggle.setAttribute("aria-expanded", "false");
        });
      });
    }

    function initLangButtons() {
      document.querySelectorAll(".lang-btn").forEach((button) => {
        button.addEventListener("click", () => {
          setLanguage(button.dataset.lang);
        });
      });
    }

    function init() {
      nodes.year.textContent = new Date().getFullYear();
      initMenu();
      initLangButtons();
      handleScroll();
      window.addEventListener("scroll", handleScroll, { passive: true });

      let savedLang = "fr";
      try {
        savedLang = localStorage.getItem("chady-digital-lang") || "fr";
      } catch (error) {
        savedLang = "fr";
      }

      setLanguage(savedLang, false);
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
